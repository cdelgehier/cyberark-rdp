---
name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        id: changelog
        run: |
          # Extract the changelog section for this version
          TAG="${{ steps.version.outputs.tag }}"

          CHANGELOG_SECTION=$(awk -v tag="$TAG" '
            /^## v/ {
              if (found) exit
              if ($2 == tag) found=1
              next
            }
            found {print}
          ' CHANGELOG.md)

          # If empty, use the complete changelog
          if [ -z "$CHANGELOG_SECTION" ]; then
            CHANGELOG_SECTION=$(cat CHANGELOG.md)
          fi

          # Save to a file to avoid escaping problems
          echo "$CHANGELOG_SECTION" > release_notes.md

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "✅ GitHub Release created for version ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "📦 Release URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: create-release

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build release
        run: cargo build --release

      - name: Create app bundle
        run: cargo bundle --release

      - name: Sign the app bundle
        run: |
          codesign --force --deep --sign - \
            target/release/bundle/osx/CyberArk\ RDP.app

      - name: Create DMG
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          create-dmg \
            --volname "CyberArk RDP" \
            --volicon "icon.png" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "CyberArk RDP.app" 200 190 \
            --hide-extension "CyberArk RDP.app" \
            --app-drop-link 600 185 \
            "CyberArk-RDP-${VERSION}.dmg" \
            "target/release/bundle/osx/CyberArk RDP.app"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: CyberArk-RDP-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "✅ macOS DMG built and uploaded" >> $GITHUB_STEP_SUMMARY
          ls -lh CyberArk-RDP-*.dmg >> $GITHUB_STEP_SUMMARY
...
